<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Spreadsheet Checker</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Payroll Spreadsheet Checker</h1>
            <p class="subtitle">Upload a payroll spreadsheet to check for errors</p>
        </header>

        <div id="upload-zone">
            <input type="file" id="file-input" accept=".xls,.xlsx" hidden>
            <div id="drop-area" onclick="document.getElementById('file-input').click()">
                <div class="drop-icon">&#128196;</div>
                <p>Drop your .xls or .xlsx file here</p>
                <p class="drop-hint">or click to browse</p>
            </div>
        </div>

        <div id="chat-area" style="display:none">
            <div id="file-badge"></div>
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="chat-input" placeholder="Ask a follow-up question about the spreadsheet..." disabled>
                <button id="send-btn" onclick="handleSend()" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
